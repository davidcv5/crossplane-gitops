apiVersion: networking.oci.upbound.io/v1alpha1
kind: RouteTable
metadata:
  name: test-private-route-table
  labels:
    testing.upbound.io/example-name: test-private-route-table
    route.type: private
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  forProvider:
    compartmentId: "ocid1.compartment.oc1..aaaaaaaavn2sncyioaydldub5sbu44yolvenr44fcsb57vtu3z6mxhizndva"
    displayName: "test-private-rt"
    vcnIdRef:
      name: test-vcn
    routeRules:
      - description: "Default route to NAT Gateway"
        destinationType: "CIDR_BLOCK"
        destination: "0.0.0.0/0"
        networkEntityIdSelector:
          matchLabels:
            testing.upbound.io/example-name: test-nat-gateway
  providerConfigRef:
    name: default
